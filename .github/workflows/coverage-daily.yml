name: Refresh broad market directory

on:
  push:
    branches: [main]
    paths: ['.github/workflows/coverage-daily.yml']
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'

concurrency:
  group: stock-brain-coverage-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      STOCK_BRAIN_SEC_ENABLED: '0'
      GH_REPO: eladyesh/stock-brain
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Name immutable data generation
        run: echo "COVERAGE_TAG=coverage-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - name: Restore prior data, refresh both directories and verify local recovery
        env:
          GH_TOKEN: ${{ github.token }}
          STOCK_BRAIN_FD_ENABLED: ${{ vars.STOCK_BRAIN_FD_ENABLED || '0' }}
          STOCK_BRAIN_FD_PUBLIC_DATA_LICENSE: ${{ vars.STOCK_BRAIN_FD_PUBLIC_DATA_LICENSE || '0' }}
          STOCK_BRAIN_FD_MAX_DAILY_REQUESTS: ${{ vars.STOCK_BRAIN_FD_MAX_DAILY_REQUESTS || '0' }}
          FINANCIAL_DATASETS_API_KEY: ${{ secrets.FINANCIAL_DATASETS_API_KEY }}
        run: python scripts/coverage_release.py build --tag "$COVERAGE_TAG"
      - name: Publish public data assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$COVERAGE_TAG" \
            build/coverage-daily/release/coverage.sqlite3.gz \
            build/coverage-daily/release/coverage-manifest.json \
            --target "$GITHUB_SHA" --title "Coverage data $COVERAGE_TAG" \
            --notes "Public listing directory and dated available datasets. Financial and research coverage remain explicitly separate. Await the offhost-verification.json asset before using this generation." \
            --prerelease --latest=false
      - name: Download published bytes and restore into empty state
        run: python scripts/coverage_release.py verify --tag "$COVERAGE_TAG"
      - name: Mark verified generation available to web replicas
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$COVERAGE_TAG" build/coverage-daily/offhost-verification.json
