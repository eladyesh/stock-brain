name: Publish company Markdown

on:
  push:
    branches: [main]
    paths: ['.github/workflows/brain-markdown.yml', 'scripts/brain_markdown.py', 'config/sections.json', 'sectors/**/companies/**']
  workflow_dispatch:
  workflow_run:
    workflows: ['Refresh US stock coverage']
    types: [completed]
    branches: [main]

concurrency:
  group: stock-brain-markdown
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate curated research before linking it
        run: python scripts/stock_brain.py check
      - name: Restore verified coverage and build every Markdown profile
        run: python scripts/brain_markdown.py export --output build/brain-data
      - name: Publish verified files without changing curated research
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/brain_markdown.py publish --output build/brain-data
