name: Discover company disclosures

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
  push:
    branches: [main, codex/research-assistant-v1]
    paths:
      - '.github/workflows/disclosures.yml'
      - 'scripts/disclosure_monitor.py'
      - 'scripts/prepare_updates.py'
      - 'config/discovery.json'

permissions:
  contents: write

concurrency:
  group: stock-brain-disclosure-monitor
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || 'StockBrain/1.0 (https://github.com/eladyesh/stock-brain)' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Restore durable queue
        shell: bash
        run: |
          mkdir -p build/monitoring
          set +e
          git ls-remote --exit-code --heads origin automation/disclosure-state > "$RUNNER_TEMP/monitor-ref"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            git fetch --no-tags origin refs/heads/automation/disclosure-state:refs/remotes/origin/automation/disclosure-state
            git show origin/automation/disclosure-state:latest.json > build/monitoring/latest.json
          elif [ "$status" -eq 2 ]; then
            cp research/monitoring/latest.json build/monitoring/latest.json
          else
            echo 'Cannot restore queue continuity; refusing to start from an empty queue.' >&2
            exit "$status"
          fi
      - name: Discover new filings and issuer announcements
        id: discovery
        run: python scripts/disclosure_monitor.py --summary build/monitoring/summary.md
      - name: Prepare at most two changed companies for review
        if: steps.discovery.outcome == 'success'
        run: python scripts/prepare_updates.py --limit 2
      - name: Persist queue on a separate state branch
        if: always() && steps.discovery.outcome != 'skipped' && github.ref_name == github.event.repository.default_branch
        shell: bash
        run: |
          test -s build/monitoring/latest.json
          git config user.name 'Stock Brain automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_INDEX_FILE="$RUNNER_TEMP/monitor-index"
          git read-tree --empty
          blob=$(git hash-object -w build/monitoring/latest.json)
          git update-index --add --cacheinfo 100644 "$blob" latest.json
          tree=$(git write-tree)
          if parent=$(git rev-parse --verify refs/remotes/origin/automation/disclosure-state 2>/dev/null); then
            if [ "$tree" = "$(git rev-parse "$parent^{tree}")" ]; then exit 0; fi
            commit=$(git commit-tree "$tree" -p "$parent" -m 'Refresh disclosure discovery queue')
          else
            commit=$(git commit-tree "$tree" -m 'Initialize disclosure discovery queue')
          fi
          git push origin "$commit:refs/heads/automation/disclosure-state"
      - name: Publish run summary
        if: always()
        shell: bash
        run: |
          if [ -f build/monitoring/summary.md ]; then cat build/monitoring/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Retain review requests and discovery status
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stock-brain-disclosures
          path: |
            build/monitoring/
            build/research/*/request.json
            build/research/*/update-plan.json
          retention-days: 30
