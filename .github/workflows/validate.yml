name: Validate Stock Brain

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate profiles and generated indexes
        run: python scripts/stock_brain.py check
      - name: Exercise knowledge-base behavior
        run: python -m unittest discover -s tests -v
      - name: Verify reviewed-only export
        run: python scripts/stock_brain.py export --output build/chunks.jsonl
